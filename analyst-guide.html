<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter & Quarry — Weekly guide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: #0a0a0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #c4b998;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(60, 20, 20, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 30, 60, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: #c4b998;
            text-align: center;
        }

        .subtitle {
            font-size: 0.8125rem;
            font-style: italic;
            color: #7a7874;
            margin-bottom: 2rem;
            text-align: center;
        }

        .week-indicator {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .week-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a4844;
            transition: all 0.4s ease;
        }

        .week-dot.active {
            background: #9a9285;
        }

        .week-dot.completed {
            background: #6a6864;
        }

        .card {
            background: linear-gradient(145deg, #141418 0%, #0d0d10 100%);
            border: 1px solid #7a7874;
            border-radius: 8px;
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            width: 100%;
            position: relative;
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.6),
                inset 0 0 40px rgba(0, 0, 0, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid #6a6864;
            border-radius: 4px;
            pointer-events: none;
        }

        .week-title {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #7a7874;
            margin-bottom: 0.5rem;
        }

        .week-name {
            font-size: 1.75rem;
            font-weight: 600;
            color: #d4c9a8;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .objective {
            font-style: italic;
            color: #8a8274;
            margin-bottom: 2rem;
            font-size: 1.125rem;
            line-height: 1.5;
        }

        .section-label {
            font-size: 0.6875rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #7a7874;
            margin-bottom: 0.75rem;
            margin-top: 1.5rem;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        .requirements {
            color: #b4aa8e;
            line-height: 1.8;
            font-size: 1rem;
        }

        .requirements li {
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .requirements ul {
            margin-left: 1.25rem;
            list-style-type: none;
        }

        .requirements ul li::before {
            content: '—';
            margin-right: 0.5rem;
            color: #6a6864;
        }

        .constraints {
            color: #9a9285;
            line-height: 1.8;
            font-size: 0.9375rem;
        }

        .constraints li {
            margin-bottom: 0.375rem;
        }

        .questions {
            color: #9a9285;
            font-style: italic;
            line-height: 1.9;
            font-size: 0.9375rem;
        }

        .questions li {
            margin-bottom: 0.5rem;
        }

        .questions li::before {
            content: '"';
            color: #7a7874;
        }

        .questions li::after {
            content: '"';
            color: #7a7874;
        }

        .analyst-note {
            margin-top: 1.5rem;
            padding: 1rem 1.25rem;
            background: rgba(196, 185, 152, 0.05);
            border-left: 2px solid #5a5854;
            color: #9a9285;
            font-size: 0.875rem;
            line-height: 1.7;
        }

        .analyst-note strong {
            color: #a89e82;
            font-weight: 600;
            display: block;
            margin-bottom: 0.375rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .button-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 1rem 1.5rem;
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: transparent;
            color: #9a9285;
            border: 1px solid #4a4844;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        button:hover:not(:disabled) {
            color: #d4c9a8;
            border-color: #6a6864;
            background: rgba(196, 185, 152, 0.05);
            box-shadow: 0 0 30px rgba(196, 185, 152, 0.05);
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .symbol {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #9a9285;
            letter-spacing: 0.5em;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final-note {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #4a4844;
            color: #9a9285;
            font-style: italic;
            font-size: 0.9375rem;
            line-height: 1.7;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="symbol">· · ·</div>
        
        <h1>Hunter & Quarry</h1>
        <div class="subtitle">Holding intent under ambiguity</div>
        
        <div class="week-indicator" id="weekIndicator">
            <div class="week-dot active"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
        </div>
        
        <div class="card" id="card">
            <!-- Content injected by JS -->
        </div>
        
        <div class="button-row">
            <button id="prevBtn" disabled>Previous week</button>
            <button id="nextBtn">Next week</button>
        </div>
    </div>

    <script>
        const weeks = [
            {
                number: 1,
                name: "Intent and contract",
                objective: "Anchor meaning before mechanics",
                requirements: [
                    "Written definition of:",
                    ["the quarry", "what 'finding' means", "the uncertainty involved"],
                    "A Cowork project contract stating:",
                    ["what the game is", "what it is not", "how Cowork should handle ambiguity—what it must not invent, fill in, or resolve"]
                ],
                constraints: [
                    "No mechanics",
                    "No UI",
                    "No optimisation"
                ],
                questions: [
                    "What would make this trivial?",
                    "What would make it impossible?",
                    "What might Cowork misunderstand later?"
                ],
                analystNote: "You're used to working with data that exists. Here, you're defining what data will exist and what it will mean. The contract isn't documentation—it's a boundary. When the AI starts 'helping' by filling gaps, the contract is what you point to and say: no, that gap is deliberate."
            },
            {
                number: 2,
                name: "World as data",
                objective: "Structure before behaviour",
                requirements: [
                    "Data representations for:",
                    ["places", "time", "events"],
                    "Explicit start and end conditions"
                ],
                constraints: [
                    "No gameplay logic",
                    "No success criteria"
                ],
                questions: [
                    "What changes over time?",
                    "What remains stable?",
                    "What breaks if time is removed?"
                ],
                analystNote: "Think schema, not dashboard. You're defining entities and relationships—what can exist, what can change, what connects to what. Resist the urge to query it. The moment you start thinking about what you'd measure, you've skipped ahead."
            },
            {
                number: 3,
                name: "Signals and evidence",
                objective: "Ambiguity without confusion",
                requirements: [
                    "Signals suggesting quarry location",
                    "Explicit distinction between:",
                    ["signal", "noise", "misleading evidence"]
                ],
                constraints: [
                    "No direct clues",
                    "No single-interpretation signals"
                ],
                questions: [
                    "Which signal would fool a bad analyst?",
                    "Which signal only matters in hindsight?"
                ],
                analystNote: "You've spent your career separating signal from noise. Now you're designing the noise. A good signal in this game is one that looks meaningful but supports multiple interpretations. If you can write a single correct query to find the quarry, you've made it too clean."
            },
            {
                number: 4,
                name: "Agency and cost",
                objective: "Meaningful choice",
                requirements: [
                    "Movement through time and space",
                    "Explicit cost or constraint for actions"
                ],
                constraints: [
                    "No global visibility",
                    "No free inspection"
                ],
                questions: [
                    "What decision is irreversible?",
                    "What does choosing this prevent?"
                ],
                analystNote: "In analysis, you can usually look at everything and filter later. Here, looking costs something. The player can't SELECT * FROM evidence—they have to choose what to examine, knowing they'll miss other things. That constraint is what turns data into decisions."
            },
            {
                number: 5,
                name: "Narrowing and being wrong",
                objective: "Justified error",
                requirements: [
                    "Mechanics to rule out possibilities",
                    "Logic that narrows hypotheses",
                    "Ability to reach wrong conclusions"
                ],
                constraints: [
                    "Wrong paths must be explainable later"
                ],
                questions: [
                    "Why was that belief reasonable at the time?",
                    "What evidence overturned it?"
                ],
                analystNote: "Good analysis can still be wrong. This week you're building a system where a careful player, doing sensible work, can reach an incorrect conclusion—and where that error is defensible given what they knew. If your game only allows wrong answers through carelessness, it's not testing judgement."
            },
            {
                number: 6,
                name: "Explanation and stop",
                objective: "Judgement over completion",
                requirements: [
                    "No new features",
                    "Written explanation covering:",
                    ["how the game works", "how the quarry is found", "what assumptions exist", "how the game can mislead"]
                ],
                constraints: [
                    "The game is frozen regardless of dissatisfaction"
                ],
                questions: [
                    "What did you choose not to solve?",
                    "What assumption is hidden here?"
                ],
                analystNote: "The deliverable isn't the game—it's your explanation of the game. Can you articulate the assumptions baked into your data model? Can you describe how a player could be misled and why that's by design? This is the skill: explaining the system, not just building it.",
                finalNote: "The game is frozen now. If you finish slightly dissatisfied but clear-headed, it worked."
            }
        ];

        let currentWeek = 0;

        const card = document.getElementById('card');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const weekIndicator = document.getElementById('weekIndicator');

        function renderWeek(index) {
            const week = weeks[index];
            
            let requirementsHTML = '<ul>';
            week.requirements.forEach(item => {
                if (Array.isArray(item)) {
                    requirementsHTML += '<ul>';
                    item.forEach(subitem => {
                        requirementsHTML += `<li>${subitem}</li>`;
                    });
                    requirementsHTML += '</ul>';
                } else {
                    requirementsHTML += `<li>${item}</li>`;
                }
            });
            requirementsHTML += '</ul>';

            let constraintsHTML = '<ul>';
            week.constraints.forEach(item => {
                constraintsHTML += `<li>${item}</li>`;
            });
            constraintsHTML += '</ul>';

            let questionsHTML = '<ul>';
            week.questions.forEach(item => {
                questionsHTML += `<li>${item}</li>`;
            });
            questionsHTML += '</ul>';

            let analystNoteHTML = '';
            if (week.analystNote) {
                analystNoteHTML = `
                    <div class="analyst-note">
                        <strong>For analysts</strong>
                        ${week.analystNote}
                    </div>
                `;
            }

            let finalNoteHTML = '';
            if (week.finalNote) {
                finalNoteHTML = `<div class="final-note">${week.finalNote}</div>`;
            }

            card.innerHTML = `
                <div class="week-title">Week ${week.number}</div>
                <div class="week-name">${week.name}</div>
                <div class="objective">${week.objective}</div>
                
                <div class="section-label">Required outputs</div>
                <div class="requirements">${requirementsHTML}</div>
                
                <div class="section-label">Constraints</div>
                <div class="constraints">${constraintsHTML}</div>
                
                <div class="section-label">Questions to consider</div>
                <div class="questions">${questionsHTML}</div>
                
                ${analystNoteHTML}
                ${finalNoteHTML}
            `;

            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');

            // Update dots
            const dots = weekIndicator.querySelectorAll('.week-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'completed');
                if (i < index) {
                    dot.classList.add('completed');
                } else if (i === index) {
                    dot.classList.add('active');
                }
            });

            // Update buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === weeks.length - 1;
            nextBtn.textContent = index === weeks.length - 1 ? 'End' : 'Next week';
        }

        prevBtn.addEventListener('click', () => {
            if (currentWeek > 0) {
                currentWeek--;
                renderWeek(currentWeek);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentWeek < weeks.length - 1) {
                currentWeek++;
                renderWeek(currentWeek);
            }
        });

        // Initialize
        renderWeek(0);
    </script>
</body>
</html>
