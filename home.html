<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding & Hunter & Quarry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: #0a0a0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #c4b998;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(60, 20, 20, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 30, 60, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .symbol {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #5a5854;
            letter-spacing: 0.5em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: #c4b998;
            text-align: center;
        }

        .subtitle {
            font-size: 0.875rem;
            font-style: italic;
            color: #7a7874;
            margin-bottom: 3rem;
            text-align: center;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        a {
            display: block;
            padding: 1.25rem 1.5rem;
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 1rem;
            text-decoration: none;
            background: transparent;
            color: #a89e82;
            border: 1px solid #4a4844;
            transition: all 0.4s ease;
            text-align: center;
        }

        a:hover {
            color: #d4c9a8;
            border-color: #6a6864;
            background: rgba(196, 185, 152, 0.05);
            box-shadow: 0 0 30px rgba(196, 185, 152, 0.05);
        }

        a span {
            display: block;
            font-size: 0.75rem;
            color: #7a7874;
            margin-top: 0.375rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="symbol">· · ·</div>
        
        <h1>Vibe Coding & Hunter & Quarry</h1>
        <div class="subtitle">IDX Strategy Team</div>
        
        <div class="links">
            <a href="prompt-generator.html">
                Vibe Coding Prompt Generator
                <span>Draw a card. Build for 15 minutes. Delete everything.</span>
            </a>
            
            <a href="index.html">
                Hunter & Quarry — Strategist Guide
                <span>Weekly curriculum for strategy team</span>
            </a>
            
            <a href="analyst-guide.html">
                Hunter & Quarry — Analyst Guide
                <span>Weekly curriculum for analysts</span>
            </a>
        </div>
    </div>
</body>
</html>
