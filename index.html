<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter & Quarry — IDX Strategy Team</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: #0a0a0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #c4b998;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(60, 20, 20, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 30, 60, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 0.6875rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #3a3834;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: #5a5449;
            text-align: center;
        }

        .subtitle {
            font-size: 0.8125rem;
            font-style: italic;
            color: #4a4844;
            margin-bottom: 2rem;
            text-align: center;
        }

        .week-indicator {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .week-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2a2824;
            transition: all 0.4s ease;
        }

        .week-dot.active {
            background: #5a5449;
        }

        .week-dot.completed {
            background: #3a3834;
        }

        .card {
            background: linear-gradient(145deg, #141418 0%, #0d0d10 100%);
            border: 1px solid #3a3834;
            border-radius: 8px;
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            width: 100%;
            position: relative;
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.6),
                inset 0 0 40px rgba(0, 0, 0, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid #2a2824;
            border-radius: 4px;
            pointer-events: none;
        }

        .week-title {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #4a4844;
            margin-bottom: 0.5rem;
        }

        .week-name {
            font-size: 1.75rem;
            font-weight: 600;
            color: #d4c9a8;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .objective {
            font-style: italic;
            color: #8a8274;
            margin-bottom: 2rem;
            font-size: 1.125rem;
            line-height: 1.5;
        }

        .section-label {
            font-size: 0.6875rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #4a4844;
            margin-bottom: 0.75rem;
            margin-top: 1.5rem;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        .requirements {
            color: #a89e82;
            line-height: 1.8;
            font-size: 1rem;
        }

        .requirements li {
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .requirements ul {
            margin-left: 1.25rem;
            list-style-type: none;
        }

        .requirements ul li::before {
            content: '—';
            margin-right: 0.5rem;
            color: #3a3834;
        }

        .constraints {
            color: #6a6254;
            line-height: 1.8;
            font-size: 0.9375rem;
        }

        .constraints li {
            margin-bottom: 0.375rem;
        }

        .questions {
            color: #7a7264;
            font-style: italic;
            line-height: 1.9;
            font-size: 0.9375rem;
        }

        .questions li {
            margin-bottom: 0.5rem;
        }

        .questions li::before {
            content: '"';
            color: #4a4844;
        }

        .questions li::after {
            content: '"';
            color: #4a4844;
        }

        .strategic-note {
            margin-top: 1.5rem;
            padding: 1rem 1.25rem;
            background: rgba(196, 185, 152, 0.03);
            border-left: 2px solid #3a3834;
            color: #6a6254;
            font-size: 0.875rem;
            line-height: 1.7;
        }

        .strategic-note strong {
            color: #8a8274;
            font-weight: 600;
            display: block;
            margin-bottom: 0.375rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .button-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 1rem 1.5rem;
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: transparent;
            color: #5a5449;
            border: 1px solid #2a2824;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        button:hover:not(:disabled) {
            color: #c4b998;
            border-color: #4a4439;
            background: rgba(196, 185, 152, 0.03);
            box-shadow: 0 0 30px rgba(196, 185, 152, 0.05);
        }

        button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .symbol {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #2a2824;
            letter-spacing: 0.5em;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final-note {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #2a2824;
            color: #5a5449;
            font-style: italic;
            font-size: 0.9375rem;
            line-height: 1.7;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="symbol">· · ·</div>
        
        <div class="logo">IDX Strategy</div>
        <h1>Hunter & Quarry</h1>
        <div class="subtitle">Holding intent under ambiguity</div>
        
        <div class="week-indicator" id="weekIndicator">
            <div class="week-dot active"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
            <div class="week-dot"></div>
        </div>
        
        <div class="card" id="card">
            <!-- Content injected by JS -->
        </div>
        
        <div class="button-row">
            <button id="prevBtn" disabled>Previous week</button>
            <button id="nextBtn">Next week</button>
        </div>
    </div>

    <script>
        const weeks = [
            {
                number: 1,
                name: "Intent and contract",
                objective: "Anchor meaning before mechanics",
                requirements: [
                    "Written definition of:",
                    ["the quarry", "what 'finding' means", "the uncertainty involved"],
                    "A Cowork project contract stating:",
                    ["what the game is", "what it is not", "how Cowork should handle ambiguity—what it must not invent, fill in, or resolve"]
                ],
                constraints: [
                    "No mechanics",
                    "No UI",
                    "No optimisation"
                ],
                questions: [
                    "What would make this trivial?",
                    "What would make it impossible?",
                    "What might Cowork misunderstand later?"
                ],
                strategicNote: "This is the week that matters most. The contract you write here is what you'll defend for five more weeks. If you can't explain the uncertainty in plain language now, the AI will flatten it later."
            },
            {
                number: 2,
                name: "World as data",
                objective: "Structure before behaviour",
                requirements: [
                    "Data representations for:",
                    ["places", "time", "events"],
                    "Explicit start and end conditions"
                ],
                constraints: [
                    "No gameplay logic",
                    "No success criteria"
                ],
                questions: [
                    "What changes over time?",
                    "What remains stable?",
                    "What breaks if time is removed?"
                ],
                strategicNote: "Think of this as building a brief before you've written the strategy. You're defining what exists, not what it means. If you find yourself explaining why something matters, stop—that's next week's problem."
            },
            {
                number: 3,
                name: "Signals and evidence",
                objective: "Ambiguity without confusion",
                requirements: [
                    "Signals suggesting quarry location",
                    "Explicit distinction between:",
                    ["signal", "noise", "misleading evidence"]
                ],
                constraints: [
                    "No direct clues",
                    "No single-interpretation signals"
                ],
                questions: [
                    "Which signal would fool a bad analyst?",
                    "Which signal only matters in hindsight?"
                ],
                strategicNote: "This is where strategic thinking shows. You're designing information that supports multiple reasonable interpretations. If a signal can only mean one thing, it's not a signal—it's an answer. Answers are cheap."
            },
            {
                number: 4,
                name: "Agency and cost",
                objective: "Meaningful choice",
                requirements: [
                    "Movement through time and space",
                    "Explicit cost or constraint for actions"
                ],
                constraints: [
                    "No global visibility",
                    "No free inspection"
                ],
                questions: [
                    "What decision is irreversible?",
                    "What does choosing this prevent?"
                ],
                strategicNote: "Strategy only exists where choices have costs. If your player can look everywhere and try everything, there's no strategy—just process. The constraint is the game."
            },
            {
                number: 5,
                name: "Narrowing and being wrong",
                objective: "Justified error",
                requirements: [
                    "Mechanics to rule out possibilities",
                    "Logic that narrows hypotheses",
                    "Ability to reach wrong conclusions"
                ],
                constraints: [
                    "Wrong paths must be explainable later"
                ],
                questions: [
                    "Why was that belief reasonable at the time?",
                    "What evidence overturned it?"
                ],
                strategicNote: "The hardest strategic skill is explaining why a reasonable person could have been wrong. Not careless. Not stupid. Wrong despite doing good work. If your game can't produce that, it's a puzzle, not an investigation."
            },
            {
                number: 6,
                name: "Explanation and stop",
                objective: "Judgement over completion",
                requirements: [
                    "No new features",
                    "Written explanation covering:",
                    ["how the game works", "how the quarry is found", "what assumptions exist", "how the game can mislead"]
                ],
                constraints: [
                    "The game is frozen regardless of dissatisfaction"
                ],
                questions: [
                    "What did you choose not to solve?",
                    "What assumption is hidden here?"
                ],
                strategicNote: "This is the assessment. Not the game—your explanation of it. Can you articulate what the system does, where it misleads, and what you deliberately left unresolved? That's the capability we're developing.",
                finalNote: "The game is frozen now. If you finish slightly dissatisfied but clear-headed, it worked."
            }
        ];

        let currentWeek = 0;

        const card = document.getElementById('card');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const weekIndicator = document.getElementById('weekIndicator');

        function renderWeek(index) {
            const week = weeks[index];
            
            let requirementsHTML = '<ul>';
            week.requirements.forEach(item => {
                if (Array.isArray(item)) {
                    requirementsHTML += '<ul>';
                    item.forEach(subitem => {
                        requirementsHTML += `<li>${subitem}</li>`;
                    });
                    requirementsHTML += '</ul>';
                } else {
                    requirementsHTML += `<li>${item}</li>`;
                }
            });
            requirementsHTML += '</ul>';

            let constraintsHTML = '<ul>';
            week.constraints.forEach(item => {
                constraintsHTML += `<li>${item}</li>`;
            });
            constraintsHTML += '</ul>';

            let questionsHTML = '<ul>';
            week.questions.forEach(item => {
                questionsHTML += `<li>${item}</li>`;
            });
            questionsHTML += '</ul>';

            let strategicNoteHTML = '';
            if (week.strategicNote) {
                strategicNoteHTML = `
                    <div class="strategic-note">
                        <strong>For strategists</strong>
                        ${week.strategicNote}
                    </div>
                `;
            }

            let finalNoteHTML = '';
            if (week.finalNote) {
                finalNoteHTML = `<div class="final-note">${week.finalNote}</div>`;
            }

            card.innerHTML = `
                <div class="week-title">Week ${week.number}</div>
                <div class="week-name">${week.name}</div>
                <div class="objective">${week.objective}</div>
                
                <div class="section-label">Required outputs</div>
                <div class="requirements">${requirementsHTML}</div>
                
                <div class="section-label">Constraints</div>
                <div class="constraints">${constraintsHTML}</div>
                
                <div class="section-label">Questions to consider</div>
                <div class="questions">${questionsHTML}</div>
                
                ${strategicNoteHTML}
                ${finalNoteHTML}
            `;

            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');

            // Update dots
            const dots = weekIndicator.querySelectorAll('.week-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'completed');
                if (i < index) {
                    dot.classList.add('completed');
                } else if (i === index) {
                    dot.classList.add('active');
                }
            });

            // Update buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === weeks.length - 1;
            nextBtn.textContent = index === weeks.length - 1 ? 'End' : 'Next week';
        }

        prevBtn.addEventListener('click', () => {
            if (currentWeek > 0) {
                currentWeek--;
                renderWeek(currentWeek);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentWeek < weeks.length - 1) {
                currentWeek++;
                renderWeek(currentWeek);
            }
        });

        // Initialize
        renderWeek(0);
    </script>
</body>
</html>
